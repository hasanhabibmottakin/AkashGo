name: Fetch and Update Playlists

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Process Data using Shell
        env:
          KEY_API: ${{ secrets.key_api }}
          MAIN_APP_API: ${{ secrets.main_app_api }}
        run: |
          curl -s "$MAIN_APP_API" > raw.m3u
          echo "#EXTM3U" > playlist.m3u
          > items.json
          
          tvg_id=""
          tvg_name=""
          tvg_logo=""
          group_title=""
          extinf_line=""
          props=()
          key=""
          
          while IFS= read -r line || [[ -n "$line" ]]; do
            line=$(echo "$line" | tr -d '\r')
            if [[ -z "$line" ]]; then continue; fi
            
            if [[ "$line" == \#EXTINF* ]]; then
              tvg_id=$(echo "$line" | grep -oP 'tvg-id="\K[^"]+' || true)
              tvg_name=$(echo "$line" | grep -oP 'tvg-name="\K[^"]+' || true)
              tvg_logo=$(echo "$line" | grep -oP 'tvg-logo="\K[^"]+' || true)
              group_title=$(echo "$line" | grep -oP 'group-title="\K[^"]+' || true)
              extinf_line="$line"
              props=()
              key=""
            elif [[ "$line" == \#KODIPROP* ]]; then
              props+=("$line")
              if [[ "$line" == *license_key=* ]]; then
                key="${line#*=}"
              fi
            elif [[ "$line" != \#* ]]; then
              url="$line"
              
              if [[ "$url" == *.mpd && -z "$key" && -n "$tvg_id" ]]; then
                sleep $((RANDOM % 31 + 30))
                key_resp=$(curl -s "${KEY_API}${tvg_id}")
                key=$(echo "$key_resp" | jq -r '.keys[0] // empty')
              fi
              
              echo "$extinf_line" >> playlist.m3u
              prop_added="false"
              
              for prop in "${props[@]}"; do
                if [[ "$prop" == *license_key=* ]]; then
                  echo "#KODIPROP:inputstream.adaptive.license_key=$key" >> playlist.m3u
                  prop_added="true"
                else
                  echo "$prop" >> playlist.m3u
                fi
              done
              
              if [[ "$url" == *.mpd && -n "$key" && "$prop_added" == "false" ]]; then
                echo "#KODIPROP:inputstream=inputstream.adaptive" >> playlist.m3u
                echo "#KODIPROP:inputstream.adaptive.manifest_type=mpd" >> playlist.m3u
                echo "#KODIPROP:inputstream.adaptive.license_type=clearkey" >> playlist.m3u
                echo "#KODIPROP:inputstream.adaptive.license_key=$key" >> playlist.m3u
              fi
              
              echo "$url" >> playlist.m3u
              
              jq -n -c \
                --arg name "$tvg_name" \
                --arg logo "$tvg_logo" \
                --arg title "$group_title" \
                --arg drmlicense "$key" \
                --arg link "$url" \
                '{name: $name, logo: $logo, title: $title, drmlicense: $drmlicense, useragent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/145.0.0.0 Safari/537.36", referer: "", link: $link}' >> items.json
            fi
          done < raw.m3u
          
          echo "[" > playlist.json
          sed -e '$!s/$/,/' items.json >> playlist.json
          echo "]" >> playlist.json
          
          rm raw.m3u items.json
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u playlist.json
          git commit -m "Auto-update playlist files" || exit 0
          git push
