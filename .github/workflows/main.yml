name: Fetch and Update Playlists

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Process Data using Shell
        env:
          MAIN_APP_API: ${{ secrets.main_app_api }}
        run: |
          curl -s "$MAIN_APP_API" > raw.m3u
          echo "#EXTM3U" > playlist.m3u
          echo "# Disclaimer: This playlist is generated strictly for educational purposes. If there are any issues, please notify me and I will take it down immediately." >> playlist.m3u
          > items.json
          
          tvg_id=""
          tvg_name=""
          tvg_logo=""
          group_title=""
          extinf_line=""
          props=()
          
          while IFS= read -r line || [[ -n "$line" ]]; do
            line=$(echo "$line" | tr -d '\r')
            if [[ -z "$line" ]]; then continue; fi
            
            if [[ "$line" == \#EXTINF* ]]; then
              tvg_id=$(echo "$line" | grep -oP 'tvg-id="\K[^"]+' || true)
              tvg_name=$(echo "$line" | grep -oP 'tvg-name="\K[^"]+' || true)
              tvg_logo=$(echo "$line" | grep -oP 'tvg-logo="\K[^"]+' || true)
              group_title=$(echo "$line" | grep -oP 'group-title="\K[^"]+' || true)
              extinf_line="$line"
              props=()
            elif [[ "$line" == \#KODIPROP* ]]; then
              if [[ "$line" != *license_key=* ]]; then
                props+=("$line")
              fi
            elif [[ "$line" != \#* ]]; then
              url="$line"
              worker_url=""
              
              echo "$extinf_line" >> playlist.m3u
              
              for prop in "${props[@]}"; do
                echo "$prop" >> playlist.m3u
              done
              
              if [[ "$url" == *.mpd ]]; then
                if [[ ${#props[@]} -eq 0 ]]; then
                  echo "#KODIPROP:inputstream=inputstream.adaptive" >> playlist.m3u
                  echo "#KODIPROP:inputstream.adaptive.manifest_type=mpd" >> playlist.m3u
                  echo "#KODIPROP:inputstream.adaptive.license_type=clearkey" >> playlist.m3u
                fi
                if [[ -n "$tvg_id" ]]; then
                  worker_url="https://akashgo.hasanhabibmottakin.workers.dev/?id=${tvg_id}|User-Agent=https://t.me/codecrafter_codecphp"
                  echo "#KODIPROP:inputstream.adaptive.license_key=${worker_url}" >> playlist.m3u
                fi
              fi
              
              echo "$url" >> playlist.m3u
              
              jq -n -c \
                --arg name "$tvg_name" \
                --arg logo "$tvg_logo" \
                --arg title "$group_title" \
                --arg drmlicense "$worker_url" \
                --arg link "$url" \
                '{name: $name, logo: $logo, title: $title, drmlicense: $drmlicense, useragent: "https://t.me/codecrafter_codecphp", referer: "", link: $link}' >> items.json
            fi
          done < raw.m3u
          
          echo "[" > playlist.json
          sed -e '$!s/$/,/' items.json >> playlist.json
          echo "]" >> playlist.json
          
          rm raw.m3u items.json
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u playlist.json
          git commit -m "Auto-update playlist files" || exit 0
          git push
